<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SmartHIVCare | Bilingual ART Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e74c3c;
            --success: #27ae60;
            --bg: #f4f7f6;
            --white: #ffffff;
            --user-bubble: #2c3e50;
            --bot-bubble: #ffffff;
        }

        body { 
            background-color: var(--bg); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        .chat-container { 
            max-width: 500px; 
            margin: 30px auto; 
            background: var(--white); 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            overflow: hidden; 
        }
        
        /* Updated Header with Login Colors */
        .header { 
            background: var(--primary); 
            color: white; 
            padding: 18px 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--accent);
        }

        .header-title-area {
            flex-grow: 1;
        }
        
        #chat-window { 
            height: 400px; 
            overflow-y: auto; 
            padding: 25px; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .message-group { display: flex; flex-direction: column; width: 100%; }
        .message { 
            max-width: 85%; 
            padding: 12px 18px; 
            border-radius: 12px; 
            position: relative; 
            font-size: 15px; 
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        /* User message matches Login Primary */
        .user-group { align-items: flex-end; }
        .user-msg { 
            background: var(--primary); 
            color: white; 
            border-bottom-right-radius: 2px; 
        }
        
        /* Bot message matches Login White/Border style */
        .bot-group { align-items: flex-start; }
        .bot-msg { 
            background: var(--white); 
            color: var(--secondary); 
            border-bottom-left-radius: 2px; 
            border: 1px solid #dee2e6; 
            white-space: pre-wrap; 
        }

        .copy-icon {
            cursor: pointer;
            font-size: 1.1rem;
            margin-left: 10px;
            color: #95a5a6;
            transition: color 0.2s;
        }
        .copy-icon:hover { color: var(--accent); }

        .transcription-tag { 
            font-size: 0.85rem; 
            color: #7f8c8d; 
            font-style: italic; 
            border-bottom: 1px dashed #ccc; 
            margin-bottom: 8px; 
            display: block; 
        }

        .action-btns { font-size: 11px; margin-top: 5px; color: var(--primary); cursor: pointer; opacity: 0.8; }
        .action-btns:hover { opacity: 1; }

        .edit-area { 
            width: 100%; 
            border: 1px solid var(--primary); 
            border-radius: 8px; 
            padding: 10px; 
            min-height: 60px; 
            margin-bottom: 5px; 
        }

        .controls { 
            padding: 20px; 
            background: var(--white); 
            border-top: 1px solid #eee; 
        }

        #loading { 
            display: none; 
            text-align: center; 
            font-size: 14px; 
            color: var(--primary); 
            margin-bottom: 10px; 
            font-weight: bold; 
        }

        /* Labels and Selects */
        .form-label { color: var(--secondary); }
        .form-select:focus, .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(44, 62, 80, 0.1);
        }

        /* Buttons matching Login Style */
        .btn-primary { 
            background-color: var(--primary); 
            border-color: var(--primary); 
        }
        .btn-primary:hover { 
            background-color: var(--secondary); 
            border-color: var(--secondary); 
        }

        .btn-outline-danger { 
            color: var(--accent); 
            border-color: var(--accent); 
        }
        .btn-outline-danger:hover { 
            background-color: var(--accent); 
            color: white; 
        }

        .recording-status { color: var(--accent); font-weight: bold; animation: blink 1s infinite; display: none; }
        @keyframes blink { 50% { opacity: 0; } }

        .btn-logout {
            border-color: rgba(255,255,255,0.5) !important;
        }
        .btn-logout:hover {
            background-color: var(--accent) !important;
            border-color: var(--accent) !important;
            color: white !important;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-title-area">
            <h5 class="mb-0"><i class="fas fa-user-md me-2"></i>SmartHIVCare</h5>
            <small style="opacity: 0.8;">Logged in as: {{ username }}</small>
        </div>
        
        <div class="header-action d-flex gap-2">
            <button class="btn btn-sm btn-outline-light" onclick="clearHistory()">Reset</button>
            <a href="/logout" class="btn btn-sm btn-outline-light btn-logout" style="text-decoration: none;">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </div>

    <div id="chat-window">
        <div class="message-group bot-group">
            <div class="message bot-msg" id="welcome-text">
                Hello! I am your medical assistant. How can I help you with HIV/AIDS or ART treatment today?
            </div>
        </div>
    </div>

    <div id="loading">✨ Analyzing medical data...</div>

    <div class="controls">
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <label class="form-label small fw-bold">Language</label>
                <select id="language" class="form-select form-select-sm" onchange="updateWelcomeMessage()">
                    <option value="English" selected>English</option>
                    <option value="Amharic">አማርኛ</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Input</label>
                <select id="input_mode" class="form-select form-select-sm" onchange="toggleInputUI()">
                    <option value="Text">Text</option>
                    <option value="Voice">Voice</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Output</label>
                <select id="output_mode" class="form-select form-select-sm">
                    <option value="Text">Text</option>
                    <option value="Voice">Voice</option>
                </select>
            </div>
        </div>

        <div id="text-input-wrapper">
            <textarea id="user-input" class="form-control mb-2" rows="2" placeholder="Ask a question..."></textarea>
        </div>

        <div id="voice-input-wrapper" style="display:none;" class="mb-2">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-danger flex-grow-1" id="record-btn">🎤 Record Voice</button>
                <button class="btn btn-outline-secondary" id="play-record-btn" style="display:none;">▶️ Review</button>
            </div>
            <div id="record-status" class="recording-status text-center mt-1">🔴 Recording...</div>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-bold" id="ask-btn">SEND QUESTION</button>
        <audio id="audio-player" class="mt-3 w-100" controls style="display:none;"></audio>
    </div>
</div>

<script>
    /* ... (All existing JavaScript remains exactly the same as your original index.html) ... */
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const askBtn = document.getElementById('ask-btn');
    const recordBtn = document.getElementById('record-btn');
    const playRecordBtn = document.getElementById('play-record-btn');
    const audioPlayer = document.getElementById('audio-player');
    const loading = document.getElementById('loading');
    const recordStatus = document.getElementById('record-status');

    let mediaRecorder;
    let audioChunks = [];
    let lastRecordedBlob = null;
    let reviewAudio = new Audio();

    function copyAnswer(id) {
        const textToCopy = document.getElementById(`content-${id}`).innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const btn = document.getElementById(`btn-${id}`);
            btn.innerText = "✅";
            setTimeout(() => { btn.innerText = "📋"; }, 2000);
        });
    }

    function updateWelcomeMessage() {
        const lang = document.getElementById('language').value;
        document.getElementById('welcome-text').innerText = (lang === "Amharic") 
            ? "ጤና ይስጥልኝ! ስለ HIV/AIDS ወይም ስለ ART ህክምና ምን ማወቅ ይፈልጋሉ?" 
            : "Hello! I am your medical assistant. How can I help you with HIV/AIDS or ART treatment today?";
    }

    function toggleInputUI() {
        const mode = document.getElementById('input_mode').value;
        document.getElementById('text-input-wrapper').style.display = (mode === 'Text') ? 'block' : 'none';
        document.getElementById('voice-input-wrapper').style.display = (mode === 'Voice') ? 'block' : 'none';
        lastRecordedBlob = null;
        playRecordBtn.style.display = 'none';
    }

    function appendMessage(role, text, transcription = null, id = Date.now()) {
        const group = document.createElement('div');
        group.className = `message-group ${role === 'user' ? 'user-group' : 'bot-group'} chat-entry`;
        group.id = `msg-container-${id}`;

        if (role === 'user') {
            group.innerHTML = `
                <div class="message user-msg" id="text-bubble-${id}">${text}</div>
                <div class="action-btns" id="actions-${id}">
                    <span onclick="startInPlaceEdit('${id}')">✏️ Edit</span> | 
                    <span class="text-danger" onclick="deleteMessage('${id}')">🗑️ Delete</span>
                </div>`;
        } else {
            let content = text;
            if (transcription) {
                content = `<span class="transcription-tag">👂 I heard: "${transcription}"</span><span id="content-${id}">${text}</span>`;
            } else {
                content = `<span id="content-${id}">${text}</span>`;
            }
            
            group.innerHTML = `
                <div class="d-flex align-items-start">
                    <div class="message bot-msg">${content}</div>
                    <span class="copy-icon" id="btn-${id}" onclick="copyAnswer('${id}')" title="Copy Answer">📋</span>
                </div>`;
        }

        chatWindow.appendChild(group);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return id;
    }

    function startInPlaceEdit(id) {
        const bubble = document.getElementById(`text-bubble-${id}`);
        const currentText = bubble.innerText;
        bubble.innerHTML = `
            <textarea class="edit-area" id="edit-field-${id}">${currentText}</textarea>
            <button class="btn btn-sm btn-primary w-100" onclick="saveInPlaceEdit('${id}')">Save & Re-ask</button>
        `;
        document.getElementById(`actions-${id}`).style.display = 'none';
    }

    function saveInPlaceEdit(id) {
        const newText = document.getElementById('edit-field-' + id).value;
        const container = document.getElementById('msg-container-' + id);
        if (container.nextElementSibling && container.nextElementSibling.classList.contains('bot-group')) {
            container.nextElementSibling.remove();
        }
        container.remove();
        appendMessage('user', newText, null, id);
        sendApiRequest(newText);
    }

    function deleteMessage(id) {
        if (confirm("Remove this interaction?")) {
            const userMsg = document.getElementById('msg-container-' + id);
            if (userMsg.nextElementSibling && userMsg.nextElementSibling.classList.contains('bot-group')) {
                userMsg.nextElementSibling.remove();
            }
            userMsg.remove();
        }
    }

    function clearHistory() {
        if (confirm("Clear all messages?")) {
            document.querySelectorAll('.chat-entry').forEach(e => e.remove());
        }
    }

    recordBtn.onclick = async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    lastRecordedBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    reviewAudio.src = URL.createObjectURL(lastRecordedBlob);
                    playRecordBtn.style.display = 'block';
                    recordBtn.innerText = "🎤 Re-record";
                };
                mediaRecorder.start();
                recordStatus.style.display = 'block';
                recordBtn.innerText = "⏹ Stop Recording";
            } catch (err) {
                alert("Microphone access denied.");
            }
        } else {
            mediaRecorder.stop();
            recordStatus.style.display = 'none';
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
    };

    playRecordBtn.onclick = () => reviewAudio.play();

    async function sendApiRequest(text, blob = null) {
        const formData = new FormData();
        formData.append('language', document.getElementById('language').value);
        formData.append('answer_mode', document.getElementById('output_mode').value);

        if (blob) formData.append('question', blob, 'recording.wav');
        else formData.append('question', text);

        loading.style.display = "block";
        audioPlayer.style.display = "none";

        try {
            const response = await fetch('/ask', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            appendMessage('bot', data.answer, data.transcription);

            if (document.getElementById('output_mode').value === "Voice" && data.audio) {
                audioPlayer.src = `data:audio/wav;base64,${data.audio}`;
                audioPlayer.style.display = "block";
                audioPlayer.play().catch(e => console.warn("Auto-play blocked"));
            }
        } catch (e) {
            appendMessage('bot', "⚠️ Error: " + e.message);
        } finally {
            loading.style.display = "none";
        }
    }

    askBtn.onclick = () => {
        const mode = document.getElementById('input_mode').value;
        if (mode === 'Text') {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            sendApiRequest(text);
            userInput.value = "";
        } else {
            if (!lastRecordedBlob) return alert("Please record your voice first.");
            appendMessage('user', "🎙️ (Processing Voice Query...)");
            sendApiRequest(null, lastRecordedBlob);
            lastRecordedBlob = null;
            playRecordBtn.style.display = 'none';
            recordBtn.innerText = "🎤 Record Voice";
        }
    };
</script>
</body>
</html>
